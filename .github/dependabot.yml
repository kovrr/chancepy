version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Jerusalem
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
